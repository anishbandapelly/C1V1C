name: Scaffold checks (not application release certification)
on:
  push:
  pull_request:
jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight test dependency
        run: python -m pip install 'pytest>=8,<10'
      - name: Verify scaffold and fixtures (NOT app integration)
        run: |
          python scripts/preflight.py
          python -m pytest -q

      - name: Check non-secret AWS configuration (NOT a live AWS test)
        run: python scripts/aws_config_check.py
      - name: Reject tracked environment secrets (best-effort)
        run: python scripts/secret_safety_check.py
